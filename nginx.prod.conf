resolver 127.0.0.11 valid=30s;

# ====================== RATE LIMIT ZONES ======================
# zone:size   rate
limit_req_zone $binary_remote_addr zone=general:15m     rate=80r/m;   # Lectura general
limit_req_zone $binary_remote_addr zone=ai_endpoints:10m rate=15r/m;  # IA (costosa)
limit_req_zone $binary_remote_addr zone=post_actions:10m rate=40r/m;  # Crear, votar, responder
limit_req_zone $binary_remote_addr zone=auth:10m        rate=12r/m;   # Login / OAuth

server {
    listen 80;
    server_name laveladazone.duckdns.org;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name laveladazone.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/laveladazone.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laveladazone.duckdns.org/privkey.pem;

    # ====================== STATIC FILES ======================
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ====================== IA ENDPOINTS (costosos) ======================
    # Análisis IA, predicciones IA, narraciones
    location ~* ^/api/v1/fighters/(.*/analysis|fights/.*/ai-prediction|editions/.*/summary) {
        limit_req zone=ai_endpoints burst=8 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # ====================== PREDICTIONS (lo más importante ahora) ======================
    # GET - Lectura (community_stats, leaderboard, arguments list, etc.)
    location ~* ^/api/v1/predictions/(community_stats|leaderboard|arguments|betrayals) {
        limit_req zone=general burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # POST/PUT - Acciones (crear predicción, argumento, voto, reply)
    location ~* ^/api/v1/predictions/ {
        limit_req zone=post_actions burst=25 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # ====================== API GENERAL ======================
    location /api/ {
        limit_req zone=general burst=35 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # ====================== AUTH ======================
    location /auth/ {
        limit_req zone=auth burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /auth/callback {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # ====================== ADMIN ======================
    location /admin/ {
        limit_req zone=auth burst=20 nodelay;   # Admin debe ser más protegido
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # ====================== FRONTEND (Next.js) ======================
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
}