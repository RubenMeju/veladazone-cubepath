resolver 127.0.0.11 valid=30s ipv6=off;

# ====================== RATE LIMIT ZONES ======================
limit_req_zone $binary_remote_addr zone=general:15m      rate=80r/m;
limit_req_zone $binary_remote_addr zone=ai_endpoints:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=post_actions:10m rate=40r/m;
limit_req_zone $binary_remote_addr zone=auth:10m         rate=12r/m;

# ====================== VARIABLES UPSTREAM ======================
# Con set + resolver, Nginx re-resuelve los nombres cada 30s.
# Sin esto, si el contenedor se reinicia y cambia de IP → 502.
map $host $backend  { default "backend:8000";  }
map $host $frontend { default "frontend:3000"; }

# ====================== HTTP → HTTPS ======================
server {
    listen 80;
    server_name laveladazone.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ====================== HTTPS ======================
server {
    listen 443 ssl;
    server_name laveladazone.duckdns.org;

    # ---------- SSL ----------
    ssl_certificate     /etc/letsencrypt/live/laveladazone.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laveladazone.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------- Seguridad ----------
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- General ----------
    client_max_body_size 10m;
    proxy_read_timeout   60s;
    proxy_connect_timeout 10s;

    # ---------- Macros de headers (evitar repetición) ----------
    # Nginx no tiene include dentro de location, así que los repetimos
    # pero agrupamos las variables upstream aquí arriba.

    # ====================== STATIC FILES ======================
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ====================== IA ENDPOINTS ======================
    location ~* ^/api/v1/fighters/(.+/analysis|fights/.+/ai-prediction|editions/.+/summary) {
        limit_req zone=ai_endpoints burst=8 nodelay;
        limit_req_status 429;

        set $up http://$backend;
        proxy_pass $up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;

        proxy_read_timeout 120s;  # IA puede tardar más
    }

    # ====================== PREDICTIONS — lectura ======================
    location ~* ^/api/v1/predictions/(community_stats|leaderboard|arguments|betrayals) {
        limit_req zone=general burst=40 nodelay;
        limit_req_status 429;

        set $up http://$backend;
        proxy_pass $up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
    }

    # ====================== PREDICTIONS — escritura ======================
    location ~* ^/api/v1/predictions/ {
        limit_req zone=post_actions burst=25 nodelay;
        limit_req_status 429;

        set $up http://$backend;
        proxy_pass $up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
    }

    # ====================== FANTASY LEAGUE PREVIEW (sin auth) ======================
    location /api/v1/fantasy/leagues/preview/ {
        set $up http://$backend;
        proxy_pass $up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            "";  # sin auth deliberado
    }

    # ====================== API GENERAL ======================
    location /api/ {
        limit_req zone=general burst=35 nodelay;
        limit_req_status 429;

        set $up http://$backend;
        proxy_pass $up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
    }

    # ====================== AUTH — callback va al frontend ======================
    location /auth/callback {
        set $up http://$frontend;
        proxy_pass $up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
    }

    location /auth/ {
        limit_req zone=auth burst=15 nodelay;
        limit_req_status 429;

        set $up http://$backend;
        proxy_pass $up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
    }

    # ====================== ADMIN ======================
    location /admin/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;

        set $up http://$backend;
        proxy_pass $up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
    }

    # ====================== FRONTEND (Next.js) ======================
    location / {
        set $up http://$frontend;
        proxy_pass $up;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;

        # SSE / streaming de Next.js
        proxy_buffering    off;
        proxy_cache        off;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}